[package]
name = "nercone-fonts"
version = "0.1.0"
edition = "2021"
description = "Builds the Nercone composite font families."
license = "OFL-1.1"
repository = "https://github.com/nercone-dev/fonts/"
build = "compile.rs"

[[bin]]
name = "nercone-fonts"
path = "src/main.rs"

[lib]
name = "nercone_fonts"
path = "src/lib.rs"

[dependencies]
read-fonts = "0.42"
write-fonts = "0.51"
skrifa = "0.45"
fontdrasil = "0.4"
kurbo = "0.12"
kurbo13 = { package = "kurbo", version = "0.13" }
clap = { version = "4", features = ["derive"] }
rayon = "1"
ureq = "2"
zip = "8"
tar = "0.4"
liblzma = { version = "0.4", features = ["static"] }
flate2 = "1"
zopfli = "0.8"
sevenz-rust2 = { version = "0.21", features = ["compress"] }
ttf2woff2 = "0.13"
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
